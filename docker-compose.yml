version: '3.8'

services:
  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: omniscore-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Python FastAPI AI Microservice
  ai-engine:
    build:
      context: ./apps/ai-engine
      dockerfile: Dockerfile
    container_name: omniscore-ai-engine
    ports:
      - "8000:8000"
    environment:
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    depends_on:
      - qdrant
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # Next.js Web Frontend
  web:
    build:
      context: ./omniscore-ai
      dockerfile: Dockerfile
    container_name: omniscore-web
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_AI_ENGINE_URL=http://ai-engine:8000
    depends_on:
      - ai-engine

volumes:
  qdrant_storage:
